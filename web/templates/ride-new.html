{{define "head"}}<meta name="robots" content="noindex">{{end}}
{{define "content"}}{{with .Data}}
<article class="page">
  <p class="cal-back"><a href="/calendar">← Ride calendar</a></p>
  <h1>Add a Ride</h1>
  <p class="lead">Just the basics: the details and route go on Strava.</p>
  {{template "rider-bar" .}}
  <form class="join" method="post" action="/calendar/new">
    <input type="hidden" name="ft" value="{{.Token}}">
    <div class="hp" aria-hidden="true"><label>Leave this empty <input name="website" tabindex="-1" autocomplete="off"></label></div>
    <label>Your name <input name="leader_name" value="{{.FormName}}" required maxlength="60" autocomplete="name"></label>
    <div class="pair">
      <label>Date <input type="date" name="date" value="{{.Form.Date}}" required></label>
      <label>Start time <input type="time" name="time" value="{{.Form.Time}}"></label>
    </div>
    <label>Ride name <input name="name" value="{{.Form.Name}}" required maxlength="80" placeholder="Saturday coffee ride"></label>
    <label><span>Where it starts <span class="opt">optional</span></span> <input name="place" value="{{.Form.Place}}" maxlength="100" placeholder="Leonardtown Square"></label>
    <label><span>Pace or distance <span class="opt">optional</span></span> <input name="details" value="{{.Form.Details}}" maxlength="100" placeholder="Casual · 30 mi"></label>
    <label><span>Pace groups <span class="opt">each group gets its own leader</span></span> <select name="pace">{{$pace := paceOf .Form.Groups}}{{range paceChoices}}<option value="{{.Value}}"{{if eq .Value $pace}} selected{{end}}>{{.Label}}</option>{{end}}</select></label>
    <label><span>Strava event link <span class="opt">optional, add it later if you like</span></span> <input type="url" name="strava_url" value="{{.Form.StravaURL}}" placeholder="https://www.strava.com/clubs/10197/group_events/…"></label>
    {{if .PINOn}}<label><span>Club PIN <span class="opt">optional</span></span> <input name="pin" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false">
      <span class="hint">With the PIN, your ride goes on the calendar right away. Without it, an admin approves it first.</span></label>
    {{end}}<label class="check-row"><input type="checkbox" name="lead" checked> I’ll lead this ride</label>
    <button class="btn" type="submit">{{icon "plus"}}Add to the calendar</button>
  </form>
</article>
{{end}}{{end}}

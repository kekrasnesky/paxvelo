{{define "email"}}<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light only"><meta name="supported-color-schemes" content="light only"><title>{{.Subject}}</title>
<style>
:root{color-scheme:light only}
@font-face{font-family:Poppins;font-style:normal;font-weight:300;src:url({{.SiteURL}}/static/fonts/poppins-300.woff2) format("woff2")}
@font-face{font-family:Poppins;font-style:normal;font-weight:500;src:url({{.SiteURL}}/static/fonts/poppins-500.woff2) format("woff2")}
</style></head>
<body style="margin:0;padding:0;background:#f5f2ec">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f2ec"><tr><td align="center" style="padding:24px 12px">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff">
    <tr><td bgcolor="#2d2d2d" background="{{.SiteURL}}/static/img/email-band.png" style="background:#2d2d2d url({{.SiteURL}}/static/img/email-band.png);padding:14px 24px">
      <a href="{{.SiteURL}}/"><img src="{{.SiteURL}}/static/img/email-header.png" width="202" height="56" alt="PAXVELO" style="display:block;border:0;color:#f5f2ec;font-family:Arial,Helvetica,sans-serif;font-size:16px"></a>
    </td></tr>
    <tr><td style="padding:28px 24px 12px;font-family:Poppins,Arial,Helvetica,sans-serif;font-size:16px;font-weight:300;line-height:1.6;color:#2d2d2d">{{.Body}}</td></tr>
    <tr><td style="padding:12px 24px 28px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#77706b;border-top:1px solid #eee8e1">{{if .Links.Unsub}}You’re getting this because you joined PaxVelo. <a href="{{.Links.Mine}}" style="color:#77706b">My membership</a> · <a href="{{.Links.Unsub}}" style="color:#77706b">Unsubscribe</a>{{else if .Links.Mine}}Sent by the PaxVelo website. <a href="{{.Links.Mine}}" style="color:#77706b">My membership</a>{{else}}Sent by the PaxVelo website.{{end}}</td></tr>
  </table>
</td></tr></table>
</body>
</html>{{end}}
